version: "3.9"

services:
  backend:
    build: ./backend
    container_name: ares-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ares-data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ares-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ares-data:
